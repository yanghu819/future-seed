<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1f1f"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c96a3d"/>
    </marker>
    <style>
      .label { font: 700 26px Helvetica, Arial, sans-serif; fill: #141414; }
      .row { font: 500 18px Helvetica, Arial, sans-serif; fill: #5b5b5b; }
      .token { font: 600 19px Helvetica, Arial, sans-serif; fill: #1b1b1b; }
      .note { font: 500 18px Helvetica, Arial, sans-serif; fill: #5f5f5f; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.8; rx: 14; }
      .muted { fill: #f4f4f4; stroke: #a9a9a9; stroke-width: 1.8; rx: 14; }
      .accent { fill: #fff5ef; stroke: #c96a3d; stroke-width: 2.2; rx: 14; }
      .flow { stroke: #222222; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .seed { stroke: #c96a3d; stroke-width: 3; fill: none; marker-end: url(#arrowAccent); }
      .divider { stroke: #dedede; stroke-width: 1.5; }
      .dash { stroke: #cfcfcf; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .gate { fill: #fff5ef; stroke: #c96a3d; stroke-width: 2; }
    </style>
  </defs>

  <line x1="56" y1="260" x2="1264" y2="260" class="divider"/>

  <text x="72" y="128" class="label">Baseline</text>
  <text x="72" y="388" class="label">Future-Seed</text>

  <text x="220" y="118" class="row">layer l-1</text>
  <text x="232" y="198" class="row">layer l</text>
  <text x="220" y="378" class="row">layer l-1</text>
  <text x="182" y="458" class="row">layer l >= l_start</text>

  <rect x="340" y="86" width="126" height="48" class="box"/>
  <rect x="530" y="86" width="126" height="48" class="box"/>
  <rect x="790" y="86" width="126" height="48" class="box"/>
  <text x="403" y="116" text-anchor="middle" class="token">h1</text>
  <text x="593" y="116" text-anchor="middle" class="token">h2</text>
  <text x="853" y="116" text-anchor="middle" class="token">hT</text>
  <text x="710" y="117" text-anchor="middle" class="note">...</text>
  <path d="M 466 110 L 530 110" class="flow"/>
  <path d="M 656 110 L 790 110" class="flow"/>

  <rect x="340" y="166" width="126" height="48" class="muted"/>
  <rect x="530" y="166" width="126" height="48" class="box"/>
  <rect x="790" y="166" width="126" height="48" class="box"/>
  <text x="403" y="196" text-anchor="middle" class="token">init</text>
  <text x="593" y="196" text-anchor="middle" class="token">h1</text>
  <text x="853" y="196" text-anchor="middle" class="token">hT</text>
  <text x="710" y="197" text-anchor="middle" class="note">...</text>
  <path d="M 466 190 L 530 190" class="flow"/>
  <path d="M 656 190 L 790 190" class="flow"/>
  <text x="974" y="196" class="note">default start state</text>

  <rect x="340" y="346" width="126" height="48" class="box"/>
  <rect x="530" y="346" width="126" height="48" class="box"/>
  <rect x="790" y="346" width="126" height="48" class="box"/>
  <text x="403" y="376" text-anchor="middle" class="token">h1</text>
  <text x="593" y="376" text-anchor="middle" class="token">h2</text>
  <text x="853" y="376" text-anchor="middle" class="token">hT</text>
  <text x="710" y="377" text-anchor="middle" class="note">...</text>
  <path d="M 466 370 L 530 370" class="flow"/>
  <path d="M 656 370 L 790 370" class="flow"/>

  <rect x="326" y="426" width="154" height="48" class="accent"/>
  <rect x="530" y="426" width="126" height="48" class="box"/>
  <rect x="790" y="426" width="126" height="48" class="box"/>
  <text x="403" y="456" text-anchor="middle" class="token">g * hT</text>
  <text x="593" y="456" text-anchor="middle" class="token">h1</text>
  <text x="853" y="456" text-anchor="middle" class="token">hT</text>
  <text x="710" y="457" text-anchor="middle" class="note">...</text>
  <path d="M 480 450 L 530 450" class="flow"/>
  <path d="M 656 450 L 790 450" class="flow"/>

  <path d="M 853 394 C 1005 394, 1015 450, 480 450" class="seed"/>
  <circle cx="1008" cy="417" r="18" class="gate"/>
  <text x="1008" y="423" text-anchor="middle" class="token">g</text>

  <text x="974" y="456" class="note">same scan, new start state</text>
  <line x1="963" y1="440" x2="963" y2="462" class="dash"/>
</svg>
