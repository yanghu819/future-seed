<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="bgBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#fff1e2"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#335caa"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4492d"/>
    </marker>
    <style>
      .title { font: 700 32px Helvetica, Arial, sans-serif; fill: #13233a; }
      .subtitle { font: 700 24px Helvetica, Arial, sans-serif; fill: #13233a; }
      .body { font: 400 21px Helvetica, Arial, sans-serif; fill: #24364d; }
      .small { font: 400 18px Helvetica, Arial, sans-serif; fill: #4e6179; }
      .token { font: 600 20px Helvetica, Arial, sans-serif; fill: #17304d; }
      .panel { stroke: #c6d3e5; stroke-width: 2; rx: 28; }
      .state { fill: #ffffff; stroke: #89a9d8; stroke-width: 2; rx: 14; }
      .seed { fill: #fff0e6; stroke: #d57b62; stroke-width: 2; rx: 14; }
      .flow { stroke: #335caa; stroke-width: 5; fill: none; marker-end: url(#arrowBlue); }
      .seedflow { stroke: #c4492d; stroke-width: 6; fill: none; marker-end: url(#arrowRed); }
      .divider { stroke: #d9e1ec; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <text x="60" y="56" class="title">Future-Seed for prompt-time recurrent prefill</text>
  <text x="60" y="92" class="body">The baseline keeps each layer's default start state. Future-Seed only changes the start state of deeper layers; the within-layer scan and final decode stay causal.</text>

  <rect x="50" y="128" width="1300" height="250" class="panel" fill="url(#bgTop)"/>
  <text x="84" y="172" class="subtitle">Baseline recurrent stack</text>
  <text x="86" y="206" class="small">Each layer starts from its own default state and scans the prompt left to right.</text>
  <line x1="84" y1="255" x2="1320" y2="255" class="divider"/>
  <text x="88" y="284" class="small">Layer l-1</text>
  <text x="88" y="352" class="small">Layer l</text>

  <g transform="translate(240,0)">
    <rect x="0" y="268" width="140" height="48" class="state"/>
    <rect x="180" y="268" width="140" height="48" class="state"/>
    <rect x="360" y="268" width="140" height="48" class="state"/>
    <rect x="540" y="268" width="140" height="48" class="state"/>
    <text x="70" y="299" text-anchor="middle" class="token">h1^(l-1)</text>
    <text x="250" y="299" text-anchor="middle" class="token">h2^(l-1)</text>
    <text x="430" y="299" text-anchor="middle" class="token">h3^(l-1)</text>
    <text x="610" y="299" text-anchor="middle" class="token">hT^(l-1)</text>

    <rect x="0" y="336" width="140" height="48" class="state"/>
    <rect x="180" y="336" width="140" height="48" class="state"/>
    <rect x="360" y="336" width="140" height="48" class="state"/>
    <rect x="540" y="336" width="140" height="48" class="state"/>
    <text x="70" y="367" text-anchor="middle" class="token">h1^(l)</text>
    <text x="250" y="367" text-anchor="middle" class="token">h2^(l)</text>
    <text x="430" y="367" text-anchor="middle" class="token">h3^(l)</text>
    <text x="610" y="367" text-anchor="middle" class="token">hT^(l)</text>

    <path d="M 140 292 L 180 292" class="flow"/>
    <path d="M 320 292 L 360 292" class="flow"/>
    <path d="M 500 292 L 540 292" class="flow"/>
    <path d="M 140 360 L 180 360" class="flow"/>
    <path d="M 320 360 L 360 360" class="flow"/>
    <path d="M 500 360 L 540 360" class="flow"/>
  </g>

  <text x="1000" y="315" class="body">No cross-layer feedback path.</text>
  <text x="1000" y="346" class="body">Suffix evidence must survive only</text>
  <text x="1000" y="377" class="body">through the recurrent state itself.</text>

  <rect x="50" y="420" width="1300" height="290" class="panel" fill="url(#bgBottom)"/>
  <text x="84" y="464" class="subtitle">Future-Seed recurrent stack</text>
  <text x="86" y="498" class="small">For layers l ≥ l_start, the previous layer's terminal state seeds the next layer's start state through a small gate.</text>
  <line x1="84" y1="545" x2="1320" y2="545" class="divider"/>
  <text x="88" y="574" class="small">Layer l-1</text>
  <text x="88" y="650" class="small">Layer l ≥ l_start</text>

  <g transform="translate(240,0)">
    <rect x="0" y="558" width="140" height="48" class="state"/>
    <rect x="180" y="558" width="140" height="48" class="state"/>
    <rect x="360" y="558" width="140" height="48" class="state"/>
    <rect x="540" y="558" width="140" height="48" class="state"/>
    <text x="70" y="589" text-anchor="middle" class="token">h1^(l-1)</text>
    <text x="250" y="589" text-anchor="middle" class="token">h2^(l-1)</text>
    <text x="430" y="589" text-anchor="middle" class="token">h3^(l-1)</text>
    <text x="610" y="589" text-anchor="middle" class="token">hT^(l-1)</text>

    <rect x="0" y="634" width="140" height="48" class="seed"/>
    <rect x="180" y="634" width="140" height="48" class="state"/>
    <rect x="360" y="634" width="140" height="48" class="state"/>
    <rect x="540" y="634" width="140" height="48" class="state"/>
    <text x="70" y="665" text-anchor="middle" class="token">h0^(l)</text>
    <text x="250" y="665" text-anchor="middle" class="token">h1^(l)</text>
    <text x="430" y="665" text-anchor="middle" class="token">h2^(l)</text>
    <text x="610" y="665" text-anchor="middle" class="token">hT^(l)</text>

    <path d="M 140 582 L 180 582" class="flow"/>
    <path d="M 320 582 L 360 582" class="flow"/>
    <path d="M 500 582 L 540 582" class="flow"/>
    <path d="M 140 658 L 180 658" class="flow"/>
    <path d="M 320 658 L 360 658" class="flow"/>
    <path d="M 500 658 L 540 658" class="flow"/>
    <path d="M 610 606 C 690 606, 720 640, 100 658" class="seedflow"/>
  </g>

  <rect x="942" y="588" width="334" height="80" rx="18" fill="#fff7f0" stroke="#e3b29f" stroke-width="2"/>
  <text x="1109" y="622" text-anchor="middle" class="body">seed h0^(l) ← g^(l) ⊙ hT^(l-1)</text>
  <text x="1109" y="652" text-anchor="middle" class="small">Only this cross-layer initialization is new.</text>

  <text x="940" y="696" class="body">Decode path is unchanged:</text>
  <text x="1140" y="696" class="body">same left-to-right recurrent scan.</text>
</svg>
